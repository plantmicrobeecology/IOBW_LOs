<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSc Biology LO Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide connection map (courses → qualifications) with a detail panel beside it; panel drops below on narrow screens */
:root{
  --bg:#f6f7f4; --surface:#ffffff; --fg:#1c211d; --muted:#626b64; --line:#dde1db; --node:#3c443e; --accent:#0b6b5a;
  --q1:#0072B2; --q2:#D99400; --q3:#009E73; --q4:#D55E00; --q5:#CC79A7; --q6:#3FA3DD;
  --q7:#8C6D1F; --q8:#7A5195; --q9:#C0392B; --q10:#2E8B57; --q11:#5D6D7E;
  --sans:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chipfg:#fff; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131714; --surface:#1b201c; --fg:#e6ebe6; --muted:#9aa49c; --line:#2d342f; --node:#c6cec7; --accent:#4cc3a6;
  --q1:#4ea3e0; --q2:#f0b43c; --q3:#2fc99a; --q4:#f08a45; --q5:#e59cc6; --q6:#7cc8f2;
  --q7:#c9a654; --q8:#ad8ad1; --q9:#ec6f61; --q10:#5cc28a; --q11:#9fb0c1; --chipfg:#131714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131714; --surface:#1b201c; --fg:#e6ebe6; --muted:#9aa49c; --line:#2d342f; --node:#c6cec7; --accent:#4cc3a6;
  --q1:#4ea3e0; --q2:#f0b43c; --q3:#2fc99a; --q4:#f08a45; --q5:#e59cc6; --q6:#7cc8f2;
  --q7:#c9a654; --q8:#ad8ad1; --q9:#ec6f61; --q10:#5cc28a; --q11:#9fb0c1; --chipfg:#131714; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1380px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;max-width:62ch}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--muted);padding:5px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--bg);font-weight:600}
.seg button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=search]{font:inherit;font-size:.9rem;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);width:200px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.mapbox{overflow-x:auto;min-width:0}
svg{display:block;width:100%;min-width:760px;height:auto}
.lnk{fill:none;stroke-linecap:round;transition:opacity .15s}
svg.dim .lnk{opacity:.05}
svg.dim .lnk.on{opacity:.9}
.cl text{font-size:11.5px;fill:var(--fg);cursor:pointer}
.cl circle{fill:var(--node)}
.cl.none circle{fill:var(--bg);stroke:var(--node);stroke-width:1.2}
.cl.none text{fill:var(--muted)}
svg.dim .cl text{opacity:.35}
svg.dim .cl.on text{opacity:1;font-weight:600}
.cl.miss{opacity:.25}
.ql text{font-size:14px;font-weight:700;cursor:pointer}
svg.dim .ql{opacity:.3}
svg.dim .ql.on{opacity:1}
.hit{fill:transparent;cursor:pointer}
aside{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 40px);overflow:auto;min-width:0}
@media (max-width:900px){aside{position:static;max-height:none}}
aside h2{font-size:1.1rem;margin:0 0 2px;text-wrap:balance}
.code{font-family:var(--mono);font-size:.78rem;color:var(--muted)}
.hint{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:14px 0 6px}
ol.los{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.los li{display:grid;grid-template-columns:1.8em 1fr;gap:4px;font-size:.9rem}
ol.los .n{font-family:var(--mono);font-size:.78rem;color:var(--muted);padding-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--mono);font-size:.7rem;font-weight:500;padding:1px 6px;border-radius:3px;color:var(--chipfg)}
.chip.empty{background:transparent;color:var(--muted);border:1px dashed var(--line)}
.rows{display:flex;flex-direction:column;gap:3px}
.row{display:grid;grid-template-columns:minmax(0,1fr) 64px 1.6em;gap:8px;align-items:center;font-size:.86rem;cursor:pointer;padding:1px 4px;border-radius:4px}
.row:hover{background:var(--bg)}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;border-radius:2px}
.row .v{font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);font-size:.8rem}
.desc{font-size:.92rem;margin:6px 0 0}
.clear{font:inherit;font-size:.8rem;background:none;border:0;color:var(--accent);cursor:pointer;padding:0;margin-top:12px}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>BSc Biology LO map</h1>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Find a course" aria-label="Find a course">
      <div class="seg" role="group" aria-label="Order courses">
        <button id="o-cluster" aria-pressed="true">By qualification</button>
        <button id="o-code" aria-pressed="false">By code</button>
      </div>
      <div class="seg" role="group" aria-label="Course labels">
        <button id="l-name" aria-pressed="true">Names</button>
        <button id="l-code" aria-pressed="false">Codes</button>
      </div>
    </div>
  </header>
  <div class="main">
    <div class="mapbox"><svg id="map" role="img" aria-label="Connections between BSc courses and final qualifications"></svg></div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
const DATA = {"q": [{"n": 1, "name": "Critical analysis", "desc": "Critically analyse topical biological concepts, connecting molecules, cells, organs, organisms, populations and ecosystems across evolution, development, adaptation and disease."}, {"n": 2, "name": "Interdisciplinarity", "desc": "Integrate knowledge across subdisciplines of (medical) biology, applying mathematics, physics, chemistry, computer science and quantitative data analysis in a biological context."}, {"n": 3, "name": "Scientific method (understanding)", "desc": "Explain how biological knowledge is established through the scientific method, including experimental testing and observation-based reasoning."}, {"n": 4, "name": "Scientific method (application)", "desc": "Apply the scientific method: formulate hypotheses, design and perform experiments, collect and analyse data, draw conclusions and report findings."}, {"n": 5, "name": "Techniques", "desc": "Select and correctly apply experimental techniques relevant to (medical) biological research and adopt new methods as needed."}, {"n": 6, "name": "Literature", "desc": "Retrieve, critically evaluate and contextualise primary scientific literature in relation to own research."}, {"n": 7, "name": "Communication", "desc": "Communicate research and literature findings clearly, both verbally and in writing, to scientific and non-scientific audiences."}, {"n": 8, "name": "Teamwork", "desc": "Collaborate effectively as a member of a scientific team and contribute individual tasks to shared outcomes."}, {"n": 9, "name": "Ethics & society", "desc": "Reflect on and argue about the ethical and societal implications of (medical) biological research."}, {"n": 10, "name": "Personal development", "desc": "Reflect on personal ambitions, skills and development to make informed choices about career or further study."}, {"n": 11, "name": "Scientific integrity", "desc": "Act in accordance with Scientific Integrity Regulations in all research activities."}], "courses": [{"code": "NWI-BB005C", "name": "Animal Physiology", "ec": null, "los": [{"no": "1", "text": "Explain key physiological principles of selected processes in your own words", "q": [1, 2, 3, 4]}, {"no": "2", "text": "Describe the integrative aspects of form-function relations in the animal kingdom", "q": [1, 2, 3, 4]}, {"no": "3", "text": "Actively use the knowledge under points 1) and 2) to explain homeostasis of an animal", "q": [1, 2, 3, 4]}, {"no": "4", "text": "Explain basal pathophysiological processes that lead to specific diseases in own wording", "q": [1, 2, 3, 4]}, {"no": "5", "text": "you can work in a team to communicate an animal-physiological topic to different audiences", "q": [1, 2, 3, 4, 7, 8]}]}, {"code": "NWI-BB011B", "name": "Biology and Society", "ec": null, "los": [{"no": "1", "text": "Describe the different roles of biologists in society", "q": [3, 7]}, {"no": "2", "text": "Describe, on the basis of a case, a role of a biologist in a societal position, describe the dilemmas that biologists face in these different roles, describe basic principles of communication involved", "q": [3, 4, 5, 6, 7]}]}, {"code": "NWI-BB017C", "name": "Advanced Molecular Biology", "ec": null, "los": [{"no": "1", "text": "Describe how fundamental molecular processes contribute to the functioning of eukaryotic cells.", "q": [1]}, {"no": "2", "text": "Explain how malfunctioning of the above mentioned mechanisms can contribute to disease and in particular cancer development", "q": [2]}, {"no": "3", "text": "Interpret and design simple experiments aiming to study the above mentioned processes", "q": [3, 5]}, {"no": "4", "text": "Pinpoint, critically evaluate and present key experiments from recent scientific articles related to the course content", "q": [6, 7, 8]}]}, {"code": "NWI-BB018C", "name": "Ecophysiology of Plants", "ec": null, "los": [{"no": "1", "text": "Describe how plants interact with their biotic and abiotic environment", "q": [1]}, {"no": "2", "text": "Explain what traits determine plant fitness", "q": [1]}, {"no": "3", "text": "Explain how plants respond to spatio-temporal variation in environmental conditions at individual and population level", "q": [1, 3]}, {"no": "4", "text": "Distinguish between short- and long-term responses to changes in environment", "q": [1, 3]}, {"no": "5", "text": "Describe the mechanisms and regulatory routes that drive adaptation", "q": [1, 3]}, {"no": "6", "text": "Formulate a research question", "q": [3]}, {"no": "7", "text": "Design a simple experiment to test a plant ecophysiological hypothesis", "q": [4, 8]}]}, {"code": "NWI-BB019B", "name": "Immunology", "ec": null, "los": [{"no": "1", "text": "Identify and design molecular and cellular targets of immunotherapeutics to restore immune balance in allergy, autoimmunity, graft rejection, infection and cancer", "q": [1, 3, 4]}, {"no": "2", "text": "Describe and reason, in molecular and cellular detail, how the balance of the immune system is disturbed in the case of allergy, autoimmunity, graft rejection, infection and cancer.", "q": [1, 3, 4, 5]}, {"no": "3", "text": "Describe in molecular and cellular detail the roles of humoral and cellular immunity in the effector phase of an immune response.", "q": [1, 3, 4, 5, 7]}, {"no": "4", "text": "After encounter by the immune system of an antigen, you can describe in molecular and cellular detail how an initial immune response is regulated, and you can reason how an initial immune response may lead to either immunity or tolerance.", "q": [1, 3, 4]}, {"no": "5", "text": "You know all the differences between the innate and adaptive immune system at the molecular and cellular level", "q": [3, 4]}]}, {"code": "NWI-BB020C", "name": "Animal Adaptation Physiology", "ec": null, "los": [{"no": "1", "text": "Explain the concept of adaptations and their relation to evolution", "q": [1, 2, 3, 4]}, {"no": "2", "text": "Evaluate true adaptations from a selection of animal traits", "q": [1, 2, 3, 4]}, {"no": "3", "text": "Link adaptations to environmental factors and vice versa", "q": [1, 2, 3, 4]}, {"no": "4", "text": "Explain how an adaptation is connected to the stress axis and osmoregulation", "q": [1, 2, 3, 4]}, {"no": "5", "text": "Synthesize and apply this knowledge and clearly explain it to fellow students", "q": [1, 2, 3, 4, 7, 8]}]}, {"code": "NWI-BB021B", "name": "Neurobiophysics", "ec": null, "los": [{"no": "1", "text": "Describe physical signals and biological systems using basic concepts from systems theory.", "q": [1, 2, 3]}, {"no": "2", "text": "Appy time-domain and frequency-domain methods to analyse sensory, neural, and behavioural signals.", "q": [2, 3, 4]}, {"no": "3", "text": "Construct and simulate simple models of neural, sensory, and sensorimotor systems.", "q": [1, 2, 3, 4]}, {"no": "4", "text": "Analyse experimental neurobiophysical and psychophysical data collected during laboratory practicals.", "q": [3, 4, 5, 11]}, {"no": "5", "text": "Apply elementary computational and statistical methods to analyse neural and behavioural  data", "q": [2, 3, 4]}, {"no": "6", "text": "Design and evaluate psychophysical experiments", "q": [3, 4, 5, 11]}, {"no": "7", "text": "Explain how receptive fields, movement fields, tuning curves, and population codes represent sensory and motor variables.", "q": [1, 2, 3]}, {"no": "8", "text": "Evaluate the strengths and limitations of experimental, computational, and theoretical approaches in systems neuroscience.", "q": [1, 2, 3, 6, 9]}, {"no": "9", "text": "Report experimental and computational results clearly and reproducibly.", "q": [4, 7, 11]}]}, {"code": "NWI-BB022B", "name": "Systems Ecology", "ec": null, "los": [{"no": "1", "text": "You retrieve knowledge about the most important ecological concepts & theories* in community and systems ecology.", "q": [3]}, {"no": "2", "text": "You can identify characteristic plant- and animal species for typical ecosystems on the island of Terschelling (eg. coastal and dune systems).", "q": [3]}, {"no": "3", "text": "You link characteristic plant-and animal species to important processes in the ecosystem.", "q": [3]}, {"no": "4", "text": "You can implement ecological theories to explain how organisms have adapted to their (a)biotic environment.", "q": [3]}, {"no": "5", "text": "You design a field experiment that can answer your research hypothesis.", "q": [3, 4, 9]}, {"no": "6", "text": "Illustrate the outline of your research ideas and hypothesis by designing a graphical research proposal.", "q": [4]}, {"no": "7", "text": "You use concepts from ecological theories to explain the presence of certain patterns in biological communities and the landscape.", "q": [3]}, {"no": "8", "text": "You perform your proposed field experiment on the Island of Terschelling.", "q": [5, 9]}, {"no": "9", "text": "You perform lab work and gather data to answer your research questions.", "q": [5]}, {"no": "10", "text": "You analyze the gathered data using appropriate statistical methods to test your hypothesis and draw conclusions.", "q": [1]}, {"no": "11", "text": "You discuss your ongoing research with professionals in the field of (systems)ecology.", "q": [8]}, {"no": "12", "text": "You work efficiently collaborate in a research team with your peers.", "q": [8]}, {"no": "13", "text": "You design a research poster to support your science communication.", "q": [4, 7, 11]}, {"no": "14", "text": "You effectively communicate your research during a poster symposium organized for peers and professionals.", "q": [7]}, {"no": "15", "text": "You clearly communicate your head-to-tail research in a scientific report.", "q": [6, 7, 11]}]}, {"code": "NWI-BB024B", "name": "Physiology of Microorganisms", "ec": null, "los": [{"no": "1", "text": "Inform your colleagues on new developments in the scientific field on the basis of primary literature", "q": [1, 4, 6]}, {"no": "2", "text": "Describe experimental results in scientific reports", "q": [3, 4, 5, 6, 8, 9]}, {"no": "3", "text": "Apply the gained knowledge to the analysis of regulatory and bioenergetic processes which are studied in the practical part of the course.", "q": [2, 3, 5, 6, 8, 9]}, {"no": "4", "text": "Explain how aerobic and anaerobic microorganisms are able to conserve their energy for growth on the basis of general bioenergetics and metabolic principles.", "q": [1, 3]}, {"no": "5", "text": "Describe how microbial metabolism adapts to the changing environment at the molecular level.", "q": [1, 3]}]}, {"code": "NWI-BB025B", "name": "Human Pathology", "ec": null, "los": [{"no": "1", "text": "Students are able to analyze, integrate, and apply knowledge of the etiology, pathophysiology, clinical manifestations, and molecular mechanisms of disease processes in neoplasia and nephropathology to diagnostic, preventive, and therapeutic contexts.", "q": [1, 2, 3, 5]}, {"no": "2", "text": "Students are able to critically evaluate and apply advanced diagnostic methodologies, including molecular pathology and artificial intelligence–based approaches, to support clinical reasoning, interpretation of disease processes, and evidence-based medical decision-making.", "q": [1, 2, 4, 5, 9]}, {"no": "3", "text": "Students are able to synthesize biomedical and translational research findings to assess disease mechanisms, evaluate innovative technologies, and contribute to the development of personalized and clinically relevant diagnostic and therapeutic strategies.", "q": [1, 2, 4, 6, 9, 11]}]}, {"code": "NWI-BB027C", "name": "Applied and Environmental Microbiology", "ec": null, "los": [{"no": "1", "text": "Describe the microorganisms responsible for element conversion at different redox states and explain key types of microbial energy metabolism", "q": [1]}, {"no": "2", "text": "You will understand the biogeochemical processes within the carbon and nitrogen cycles and the impact of humans on these cycles.", "q": [2]}, {"no": "3", "text": "You will obtain an overview of the biodiversity of prokaryotes and the evolutionary relations between ecologically relevant species including current theories and concepts concerning microbial evolution.", "q": [1]}, {"no": "4", "text": "You will gain a detailed understanding of molecular ecology in theory and practice.", "q": [3, 4]}, {"no": "5", "text": "You will design and plan your own experiments in teams of two.", "q": [5, 8]}, {"no": "6", "text": "You will apply state-of-the art techniques and tools such as fluorescence in situ hybridisation, PCR and sequencing, complemented by bioinformatic analyses.", "q": [5, 8]}, {"no": "7", "text": "You will write a scientific report of the synthesis of your", "q": [6, 8]}]}, {"code": "NWI-BB028B", "name": "History of Biology", "ec": null, "los": [{"no": "1", "text": "Recognise basic connections and tensions between biology and society through historic examples, in order to better appreciate such tensions in the current practice of biology.", "q": [3, 5]}, {"no": "2", "text": "Recognise and appreciate the variety of styles and organisation of research in research in reference to basic examples from the history of biology.", "q": [3]}, {"no": "3", "text": "Recognise basic assumptions, worldviews, or metaphors in biological concepts.", "q": [3, 5]}, {"no": "4", "text": "Recognise and understand the importance of social processes (such as fame, selective attention) for the development of research, at a basic level.", "q": [3, 5, 7]}, {"no": "5", "text": "Understand how different approaches to history and current concerns affect how history is presented, based examples from the history of biology, at basic level.", "q": [3]}, {"no": "6", "text": "Refer to the basic canon in the history of biology, including key names and crucial stories that are essential to the identity of a biologist (such as Darwin or Mendel).", "q": [3]}]}, {"code": "NWI-BB032D", "name": "Biotechnology of Plants", "ec": null, "los": [{"no": "1", "text": "Explain the principles, methods and applications of modern plant biotechnology, including its contributions to crop improvement, sustainable agriculture and food security.", "q": [1]}, {"no": "2", "text": "Compare conventional breeding, genetic modification and CRISPR-based genome editing as approaches to modifying plant traits, and explain how genotype–environment interactions influence plant phenotypes.", "q": [1, 2]}, {"no": "3", "text": "Explain how molecular and cellular regulatory mechanisms control plant growth, development, regeneration and responses to environmental stress.", "q": [1]}, {"no": "4", "text": "Perform basic plant biotechnology techniques, including aseptic procedures, plant tissue culture, Agrobacterium-mediated transformation and reporter-gene assays, in compliance with laboratory and GMO biosafety protocols.", "q": [4, 5]}, {"no": "5", "text": "Accurately document experimental procedures and results, analyse and interpret data, and report findings transparently with appropriate source attribution, in accordance with principles of scientific integrity.", "q": [4, 7, 11]}, {"no": "6", "text": "Evaluate scientific evidence and the ethical, societal, regulatory and economic implications of genetically modified and genome-edited crops, and substantiate arguments from different stakeholder perspectives.", "q": [1, 7, 9]}, {"no": "7", "text": "Critically appraise primary scientific literature and case studies in plant biotechnology, distinguishing experimental evidence, conclusions and limitations.", "q": [1, 6]}, {"no": "8", "text": "Apply plant biotechnology knowledge to a new biological or crop-improvement problem by proposing and justifying a suitable experimental or technological approach.", "q": [1, 4, 5]}, {"no": "9", "text": "Communicate plant biotechnology findings and evidence-based arguments through oral presentations, visual materials and written reports, adapting explanations for scientific and non-specialist audiences.", "q": [7]}, {"no": "10", "text": "Collaborate effectively in laboratory practicals, group assignments and scientific discussions by contributing to shared tasks and integrating team members' contributions.", "q": [8]}]}, {"code": "NWI-BB036B", "name": "Applied Ecology", "ec": null, "los": [{"no": "1", "text": "Formulate adequate environmental measures that can enhance, conserve or restore biological quality in different types of systems threatened by anthropogenic activities", "q": [1, 2, 6, 8]}, {"no": "2", "text": "Argue in depth how specific ecological feedback mechanisms enhance or decrease the effectiveness of measures applied in nature and environmental management", "q": [2, 7]}, {"no": "3", "text": "Select and apply a relevant environmental quality assessment system based on biological data for a given real-life case from nature and environmental management", "q": [2, 5]}, {"no": "4", "text": "Interpret the outcome of an environmental assessment system based on biogeochemical and ecological data for a given real-life case from nature and environmental management", "q": [1, 4, 5, 10]}]}, {"code": "NWI-BB039C", "name": "Neurodevelopment", "ec": null, "los": [{"no": "1", "text": "Interpret a neurodevelopmental process and describe it at a scientific level, integrating morphological, cellular and molecular knowledge", "q": [1, 3, 4]}, {"no": "2", "text": "Discern and apply the various research approaches and strategies used by developmental neurobiologists, think critically and independently, and summarize, introduce and discuss these issues in a well-arranged report.", "q": [5, 6, 7]}, {"no": "3", "text": "Critically read and evaluate a primary research article in the neurodevelopmental research field and being able to convey understanding of the research article to peers by making and presenting a poster/giving a clear oral presentation based on the article, and critically analyze and discuss an oral presentation of a colleague student.", "q": [5, 6, 7, 8]}]}, {"code": "NWI-BB043B", "name": "Introduction to Plant Breeding", "ec": null, "los": [{"no": "1", "text": "Understand and work with the concept Domestication Syndrome", "q": [1]}, {"no": "2", "text": "Distinguish different type of molecular markers and decide how to use them in map-based cloning approaches", "q": [1, 3]}, {"no": "3", "text": "Understand how different mapping populations are constructed and decide how you can use them in breeding efforts", "q": [1, 3]}, {"no": "4", "text": "Distinguish quantitative trait loci (QTL) and genome-wide association (GWA) mapping", "q": [1]}, {"no": "5", "text": "Evaluate the pros and cons of New Plant Breeding Techniques that involve the use of genetically modified organisms", "q": [1, 9]}, {"no": "6", "text": "Present a brief lecture with a small group of fellow students (not every year)", "q": [8]}, {"no": "7", "text": "Understand presentations of guest speakers from the plant breeding sector and draw inspiration from their careers for your own future career", "q": [1, 10]}, {"no": "8", "text": "Search public databases on the internet for information on the mutants and molecular markers you need during the practical laboratory course", "q": [3, 4, 5]}, {"no": "9", "text": "Design experiments to identify the chromosomal location of genes responsible for two given mutations by map-based positioning", "q": [3, 4, 5]}, {"no": "10", "text": "Present your experiments in the form of a report written in the format of a scientific article", "q": [6, 7]}]}, {"code": "NWI-BB047C", "name": "Medical Embryology", "ec": null, "los": [{"no": "1", "text": "Describe and annotate developing animal models", "q": [1]}, {"no": "2", "text": "Explain the basic principles of development and organogenesis in animal models to your peers", "q": [1, 7]}, {"no": "3", "text": "Recognize and name parts of various developing organ systems using a light microscope", "q": [1, 5]}, {"no": "4", "text": "Interpret and discuss in a team developmental mechanisms of medical case studies", "q": [1, 8]}]}, {"code": "NWI-BB048B", "name": "Endocrinology", "ec": null, "los": [{"no": "1", "text": "Describe and annotate the histology of the major human endocrine glands", "q": [1, 6]}, {"no": "2", "text": "Schematically describe the synthesis and signaling pathways of peptide, steroid and amine hormones.", "q": [1, 2, 6]}, {"no": "3", "text": "Describe the signalling mechanisms of peptide, steroid and amine hormones.", "q": [1, 2, 6]}, {"no": "4", "text": "Schematically display stimulus-response schemes consisting of the stimuli for hormone release, target cells’ response and feedback of the major human hormone systems.", "q": [1, 3]}, {"no": "5", "text": "Use the histology and schematic displays mentioned under 1, 2, 3 and 4 to explain simple clinical cases (pathologies, diagnostics, and therapies).", "q": [2]}, {"no": "6", "text": "Collect and categorise information obtained from different sources (lectures, labs, textbooks, review papers, internet) and write this up in their own words.", "q": [1, 2, 6]}, {"no": "7", "text": "Critically read and review colleagues’ written work.", "q": [7, 10, 11]}]}, {"code": "NWI-BB060B", "name": "Animal Ecology", "ec": null, "los": [{"no": "1", "text": "Define the most important concepts in animal ecology", "q": [1, 3]}, {"no": "2", "text": "Interpret and clarify these concepts in case study situations", "q": [1, 3]}, {"no": "3", "text": "Efficiently retrieve new information from the literature", "q": [4, 6]}, {"no": "4", "text": "Organize ecological knowledge in an essay", "q": [6, 10]}, {"no": "5", "text": "Create, criticize and debate about animal ecological experiments in laboratory and field situations", "q": [7, 8]}, {"no": "6", "text": "Present ecological analyses to a target audience", "q": [10]}]}, {"code": "NWI-BB064B", "name": "Functional Genomics", "ec": null, "los": [{"no": "1", "text": "Explain key terms and concepts in functional genomics, demonstrating correct understanding of relevant molecular and biological processes", "q": [1, 3]}, {"no": "2", "text": "Has a good understanding of the experimental approaches that are relevant for research questions on the subject, as shown by the ability to design experiments to address a relevant research question and the ability to explain the possibilities and limitations of specific experimental approaches", "q": [2, 4]}, {"no": "3", "text": "Is also able to interpret and evaluate experimental results related to this field, as shown by the ability to derive and justify meaningful and legitimate conclusions from experimental data", "q": [3, 4]}]}, {"code": "NWI-BB069B", "name": "Plant Physiology", "ec": null, "los": [{"no": "1", "text": "Describe the basic functioning of plants using key concepts including water balance, nutrients, photosynthesis, signalling, development, growth and adaptation", "q": [1]}, {"no": "2", "text": "Develop plausible and effective hypotheses to study simple plant physiological questions, keeping both theory and practical execution in mind", "q": [4]}, {"no": "3", "text": "Plan and organise short lab experiments in such a way that they can be performed efficiently", "q": [4, 5]}, {"no": "4", "text": "Perform simple plant physiology experiments, collect and analyse data", "q": [4, 5]}, {"no": "5", "text": "Critically assess experimental results and draw valid conclusions using basal knowledge of plant physiology", "q": [1, 4, 6]}, {"no": "6", "text": "Report on your experimental work in an accepted scientific format", "q": [4, 7, 11]}]}, {"code": "NWI-BB071B", "name": "Intro. to Environmental Science", "ec": null, "los": [{"no": "1", "text": "Describe the cause-impact pathways for plastic pollution, climate change, habitat loss and fragmentation, and chemical pollution", "q": [2]}, {"no": "2", "text": "Explain the underlying scientific mechanisms that relate human pressures to environmental impact for plastic pollution, climate change, habitat loss and fragmentation, and chemical pollution.", "q": [1]}, {"no": "3", "text": "Identify the most important uncertainties in analysing plastic pollution, climate change impacts, habitat loss and fragmentation, and chemical pollution.", "q": [1]}, {"no": "4", "text": "Derive management strategies for plastic pollution, climate change impacts, habitat loss and fragmentation, and chemical pollution.", "q": [9]}, {"no": "5", "text": "Work in a team-based learning environment.", "q": [8]}]}, {"code": "NWI-BB076B", "name": "Personal and Professional Development", "ec": null, "los": [{"no": "1", "text": "You work on and are able to shape your personal and professional development and to reflect on your progress.", "q": [8, 10]}, {"no": "2", "text": "You are able to make well-informed decisions concerning your study and future (academic) career, taking into account your own abilities and desires.", "q": [10]}]}, {"code": "NWI-BB080C", "name": "Neural Basis of Motor Control", "ec": null, "los": [{"no": "1", "text": "Describe the small- and large-scale neural activity underlying motor control", "q": [1]}, {"no": "2", "text": "Explain the quantitative relationship between neural responses and motor control", "q": [3]}, {"no": "3", "text": "Perform basic analysis of experimental/simulated neurophysiological data", "q": [5]}, {"no": "4", "text": "Read, understand and present current literature in the field of motor control.", "q": [6, 7, 8]}]}, {"code": "NWI-BB081B", "name": "Cognitive Neuroimaging", "ec": null, "los": [{"no": "1", "text": "Learn to formulate hypotheses in cognitive neuroscience and design experiment to test them", "q": [1]}, {"no": "2", "text": "Learn basic principles of neuroimaging methods in humans and animal electrophysiology", "q": [1, 3]}, {"no": "3", "text": "Analyze human neuroscience data", "q": [2, 3]}, {"no": "4", "text": "Work in a team to develop cognitive neuroscience project", "q": [1, 2, 3, 4, 6]}]}, {"code": "NWI-BB083B", "name": "Ecological Theory and Data Analysis", "ec": null, "los": [{"no": "1", "text": "Choose and apply statistical analysis techniques matching the ecological research question and the type of data", "q": [2, 3, 8]}, {"no": "2", "text": "You understand the essentials of multivariate analyses, and can execute multiple ordination methods and interpret the results.", "q": [2, 3, 8]}, {"no": "3", "text": "You build and analyze simple dynamic models of ecological systems to test whether ecological theories can explain variation in empirical data.", "q": [2, 3, 8]}, {"no": "4", "text": "You perform these statistical analyses and dynamic models in the software environment R, preparing you for the data analyses in your BSc internship.", "q": [2, 8, 9]}]}, {"code": "NWI-BB084B", "name": "Molecular Principles of Development", "ec": null, "los": [{"no": "1", "text": "Explain the principles of animal development and associated key terms and concepts, demonstrating correct understanding of relevant molecular and developmental processes", "q": [1, 3, 8]}, {"no": "2", "text": "Interpret and evaluate experimental results (such as embryonic expression patterns and phenotypes) demonstrated by the ability to derive and justify meaningful and legitimate conclusions from experimental data", "q": [4, 5, 7, 8]}]}, {"code": "NWI-BB085C", "name": "Brain and Behaviour", "ec": null, "los": [{"no": "1", "text": "Explain the general organisation of function in the brain", "q": [1, 3]}, {"no": "2", "text": "Explain signal generation and transmission in neurons", "q": [1, 3]}, {"no": "3", "text": "Describe how sensory information is coded in taste-smell, vestibular, visual and auditory system", "q": [1, 3]}, {"no": "4", "text": "Explain the mechanisms on which the motor system and muscle control are based", "q": [1, 3]}, {"no": "5", "text": "Explain the principles of pre and post-natal brain development and neuro-degenerative/developmental disorders", "q": [1, 3]}, {"no": "6", "text": "Explain the fundamental processes supporting cognitive functions such as memory and the physiology of sleep.", "q": [1, 3]}, {"no": "7", "text": "Report on experimental findings in a report", "q": [1, 3]}, {"no": "8", "text": "Apply knowledge about neuronal activity to simulate neuronal activity in a small team", "q": [4, 8]}, {"no": "9", "text": "Conduct a basic human neuroscience experiment in a small team", "q": [4, 5, 7]}]}, {"code": "NWI-BB086", "name": "Genomics for Health and Environment", "ec": null, "los": [{"no": "1", "text": "Conduct nucleic acid isolation and library preparation for major next-generation DNA sequencing machines in a small team", "q": [3, 4, 5, 8]}, {"no": "2", "text": "Use the Bash shell to navigate directory structures, manipulate files and execute commands in an automated manner", "q": [3, 4, 5, 8]}, {"no": "3", "text": "Identify functionally relevant genetic variation in genes", "q": [1, 2, 3, 4, 5]}, {"no": "4", "text": "Define the transcriptome and explore its features in animal and plant (stem) cells", "q": [1, 2, 3, 4, 5]}, {"no": "5", "text": "Define the environmental microbiome and explain the role metagenomics plays in its investigation", "q": [1, 2, 3, 4, 5]}, {"no": "6", "text": "Explore metabolic and signal transduction pathways", "q": [1, 2, 3, 4, 5]}, {"no": "7", "text": "Report on your next generation sequencing research findings in a public talk", "q": [1, 2, 6, 7, 8]}, {"no": "8", "text": "Reflect on ethical questions and implications pertaining to next generation sequencing applications in medicine and ecology.", "q": [9, 10, 11]}]}, {"code": "NWI-BB087", "name": "Population and Evolutionary Biology", "ec": null, "los": [{"no": "1", "text": "Integrate population genetics and demography in order to predict population resilience and viability under different environmental scenarios.", "q": [1, 2]}, {"no": "2", "text": "Explain which processes contribute to adaptation in a changing environment in an eco-evolutionary context.", "q": [1]}, {"no": "3", "text": "Explain and apply the basic micro-evolutionary principles on processes at the population level.", "q": [1]}, {"no": "4", "text": "Interpret the biological meaning of molecular population data for short and long term population dynamics", "q": [1]}, {"no": "5", "text": "Explain and apply the basic methodology of population projection models (in particular matrix models)", "q": [4]}, {"no": "6", "text": "Interpret the biological meaning of population model output variables, and analyze", "q": [1]}, {"no": "7", "text": "Have a good overview of the applications of population projection models", "q": [3]}, {"no": "8", "text": "Integrate population genetics, ecology and evolutionary theory, formulate hypotheses and translate the knowledge into research projects", "q": [1, 2, 4, 5, 11]}, {"no": "9", "text": "Critically read and process scientific literature", "q": [6]}, {"no": "10", "text": "Disseminate scientific research in oral and written form", "q": [4, 7, 11]}, {"no": "11", "text": "Collaborate as a member of a scientific team", "q": [8]}]}, {"code": "NWI-BB088", "name": "Biological Invasions", "ec": null, "los": [{"no": "1", "text": "Contribute in a multidisciplinary team to a scientifically sound report and oral presentation on a risk assessment of an alien species", "q": [3, 6, 7, 8]}, {"no": "2", "text": "To explain contemporary ecological theories and concepts of biological invasions within the context of environmental risk assessment and management of alien species;", "q": [1]}, {"no": "3", "text": "To perform a climate and habitat match of alien species and to reflect critically on uncertainties of species sensitivity modelling;", "q": [1, 2]}, {"no": "4", "text": "To use indicators for analyses of pathways for introduction, spread, population establishment and impacts of alien species;", "q": [1, 2]}, {"no": "5", "text": "To identify high impact invaders and to understand their invasion biology;", "q": [1, 2]}, {"no": "6", "text": "To apply scientific sound protocols for environmental risk assessment", "q": [1, 2]}]}, {"code": "NWI-BB089", "name": "Quantitative Bioimaging", "ec": null, "los": [{"no": "1", "text": "Explain and compare the basic principles, applications, capabilities and limitations of major imaging modalities including widefield/confocal, super-resolution, multiphoton, and electron microscopy.", "q": [3]}, {"no": "2", "text": "Perform basic laboratory experiments for fluorescence sample preparation and acquire microscopy images under supervision.", "q": [5]}, {"no": "3", "text": "Perform and interpret basic quantitative image analysis using Fiji/ImageJ.", "q": [2, 11]}, {"no": "4", "text": "Orally present and critically discuss a microscopy-based research article, focusing on the imaging techniques and their appropriateness for addressing the research questions.", "q": [6, 7, 8]}, {"no": "5", "text": "Design and investigate a simple microscopy-based research question and communicate findings effectively in a written report.", "q": [4, 7, 8, 11]}]}, {"code": "NWI-BB090", "name": "Microbial Metabolism", "ec": null, "los": [{"no": "1", "text": "Distinguish different types of microbial metabolism and balance microbiologically relevant redox reactions", "q": [1, 3]}, {"no": "2", "text": "Predict which redox reaction will take place in different conditions in nature, by using the redox ladder.", "q": [1, 2]}, {"no": "3", "text": "Describe and contrast the correct common methods used in microbiology to grow, quantify and identify microorganisms in samples from different specific locations", "q": [3]}, {"no": "4", "text": "Understand phototrophy, chemolithotrophy, and (an)aerobic metabolism and the corresponding group of micro-organisms, and apply this knowledge to explain natural and man-made microbial ecosystems", "q": [1, 3]}, {"no": "5", "text": "Apply the knowledge of microbial metabolism to explain the essential processes in the biogeochemical nitrogen and carbon cycle.", "q": [1, 3, 4]}, {"no": "6", "text": "Apply the knowledge of microbial metabolism to explain why prokaryotes are important in the symbiosis with eukaryotes", "q": [1, 2]}, {"no": "7", "text": "Cooperate constructively and give positive feedback in small teams on theoretical exercises, and practical experiments", "q": [8, 11]}, {"no": "8", "text": "Independently design and execute an experiment on microbial metabolism", "q": [4, 5, 8]}, {"no": "9", "text": "Analyze experimental data from laboratory experiments and compose figures, graphs and tables for creating a scientific report", "q": [5, 7]}]}, {"code": "NWI-BB091", "name": "Genetics", "ec": null, "los": [{"no": "1", "text": "Identify and solve genetic problems so that in future you understand scientific articles with a genetic background", "q": [1]}, {"no": "2", "text": "Analyse the background of a number of human genetic disorders", "q": [1]}, {"no": "3", "text": "Perform human pedigree analysis", "q": [1]}, {"no": "4", "text": "Calculate distances between genes and/or molecular markers and make genetic maps", "q": [1, 2]}, {"no": "5", "text": "Solve genetic problems with a population genetic background", "q": [1, 2]}, {"no": "6", "text": "Solve genetic problemss with a quantitative genetic background", "q": [1, 2]}]}, {"code": "NWI-BB092", "name": "Neural basis of Cognition and Perception", "ec": null, "los": [{"no": "1", "text": "Explain and apply the functional principles of sensory processing and demonstrate how these sensory pathways create various aspects of perception including vision, sound, vestibular signals, touch and pain.", "q": [1, 2, 3]}, {"no": "2", "text": "Explain common sensory impairments of the eye, ear and sensation and explain how these impairments can be restored with neurotechnological advances, such as implants and neuroprostheses.", "q": [1, 2, 3]}, {"no": "3", "text": "Explain the anatomical organization and functional principles of the central nervous system.", "q": [1, 2, 3]}, {"no": "4", "text": "Explain and apply the functional principles of higher-order cognitive processing including the anatomy and neural mechanisms for: Attention, Executive control, Eating behaviour and value-based decision making, Emotions (and fear learning), Different types of memory, learning and plasticity.", "q": [1, 2, 3]}, {"no": "5", "text": "Explain the relationship between functional impairments in cognition and behaviour as a function of brain damage.", "q": [1, 2, 3]}, {"no": "6", "text": "Explain and interpret research experiments", "q": [1, 2, 3]}, {"no": "7", "text": "Design a neuroscientific experiment within a research proposal that is ethical, feasible and impactful.", "q": [1, 3, 4, 5, 6, 9]}, {"no": "8", "text": "Provide & receive constructive and goal-directed peer-feedback.", "q": [8, 10]}, {"no": "9", "text": "Collaborate within a team that creates different scientific output (e.g. scientific poster, research design).", "q": [8]}, {"no": "10", "text": "Communicate neuroscientific research clearly and effectively, both orally and in writing, using a poster presentation.", "q": [7]}]}, {"code": "NWI-BB093", "name": "Statistics 2", "ec": null, "los": [{"no": "1", "text": "Describe in your own words the statistical jargon used in this course, including p-value, effect size, odds ratio, Bayes factor and variance inflation factor", "q": [3]}, {"no": "2", "text": "Report the output and interpret the outcome of two-way ANOVA, multiple linear regression, meta-analysis and a Bayesian independent samples t-test", "q": [7]}, {"no": "3", "text": "Explain the factors that determine the power of an experimental design and its statistical analysis", "q": [3]}, {"no": "4", "text": "Use G*Power to calculate sample size and perform a formal power analysis for a 2-sample design, a chi-squared test and a linear regression", "q": [4]}, {"no": "5", "text": "You have performed data extraction and a simple meta-analysis.", "q": [5]}]}, {"code": "NWI-BB094", "name": "Neurons & Synapses", "ec": null, "los": [{"no": "1", "text": "Recognize the different classes of neurons in the mammalian central nervous system.", "q": [1]}, {"no": "2", "text": "Explain the structural, molecular, cellular and functional differences among the different types of neurons.", "q": [1]}, {"no": "3", "text": "Describe and categorize the forms of synaptic communication and the mechanims of synaptic transmission at chemical synapses.", "q": [3, 5, 6, 7]}, {"no": "4", "text": "Understand the principal mechanisms of spatial and temporal integration in neurons.", "q": [3, 5, 6, 7]}, {"no": "5", "text": "Identify the different forms of synaptic plasticity and define the principal mechanisms of neuronal plasticity in the nervous system.", "q": [3, 5, 6, 7]}, {"no": "6", "text": "Illustrate how changes in synaptic communication alter information processing in neuronal networks.", "q": [3, 5, 6, 7]}, {"no": "7", "text": "Describe recording and stimulation techniques in neuroscience", "q": [3, 5, 6, 7]}, {"no": "8", "text": "Analyze papers and engage in neuroscientific discussions", "q": [8, 9]}]}, {"code": "NWI-BB095", "name": "Introduction to R", "ec": null, "los": [{"no": "1", "text": "Create, load and manipulate data", "q": [2, 4]}, {"no": "2", "text": "Perform exploratory data analysis", "q": [2, 4]}, {"no": "3", "text": "Visualize your data in attractive graphs", "q": [2, 4, 7]}, {"no": "4", "text": "Create efficient code by applying functions to series of objects", "q": [2, 4]}, {"no": "5", "text": "Find help and resources to take your coding skills to a next level.", "q": [2, 4]}]}, {"code": "NWI-BB096", "name": "Environmental Toxicology", "ec": null, "los": [{"no": "1", "text": "List and characterize the basic principles of environmental toxicology", "q": [2]}, {"no": "2", "text": "Describe different kinds of environmental pollutants and explain their sources and pathways of chemicals to the environment", "q": [1]}, {"no": "3", "text": "Characterize the environmental compartments and describe which process dominate the fate of pollutants in these compartments", "q": [2]}, {"no": "4", "text": "Assess the environmental fate of chemicals based on their compound properties and the characteristics of the environment.", "q": [2]}, {"no": "5", "text": "Explain how toxicokinetic and toxicodynamic processes determine the ecotoxicity of a chemical pollutant", "q": [2]}, {"no": "6", "text": "Analyze and interpret existing data in collaboration with your peers to formulate and critically reflect on a scientifically-sound argumentation addressing environmental problems within the field of Environmental Toxicology.", "q": [1, 4, 8, 9]}]}, {"code": "NWI-BB097", "name": "Infectious Diseases", "ec": null, "los": [{"no": "1", "text": "Integrate the immunological, microbiological and cellular biological principles to describe the basic mechanism of the routes of entry and exit of the pathogen and the colonization and invasion of the host", "q": [1, 2]}, {"no": "2", "text": "Distinguish the course of infection of the different sites of the body (skin, respiratory tract, digestive tract, genital tract, blood and brain).", "q": [1]}, {"no": "3", "text": "Describe in molecular and cellular detail microbial adaptation to the host, virulence mechanisms and mechanisms of cell and tissue damage leading to acute and chronic infections.", "q": [1]}, {"no": "4", "text": "After infection of the different sites of the body the pathogen encounters the immune system. The student is able to describe in molecular and cellular detail how an initial immune response is initiated by infection and can reason how this may lead to immunity", "q": [1]}, {"no": "5", "text": "Reproduce why and how certain molecular techniques are used to study infection mechanisms", "q": [3, 5]}]}, {"code": "NWI-BB098", "name": "Medical Neurobiology", "ec": null, "los": [{"no": "1", "text": "Explain how genetic mutations lead to neurological diseases and outline methods for identifying these mutations.", "q": [1, 3]}, {"no": "2", "text": "Describe and evaluate molecular mechanisms underlyin const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("map"), panel=document.getElementById("panel");
const qc=n=>`var(--q${n})`;
let order="cluster", labels="name", pinned=null, search="";

// edges
const edges=[];
DATA.courses.forEach(c=>{
  const cnt={};
  c.los.forEach(l=>l.q.forEach(n=>cnt[n]=(cnt[n]||0)+1));
  c.cnt=cnt; c.total=Object.values(cnt).reduce((a,b)=>a+b,0);
  const ks=Object.keys(cnt);
  c.bary=ks.length?ks.reduce((s,k)=>s+k*cnt[k],0)/c.total:99;
  ks.forEach(k=>edges.push({c,n:+k,v:cnt[k]}));
});
const qCourses={}; DATA.q.forEach(q=>qCourses[q.n]=edges.filter(e=>e.n===q.n).sort((a,b)=>b.v-a.v));

function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}

function draw(){
  svg.innerHTML="";
  const cs=[...DATA.courses].sort(order==="cluster"?(a,b)=>a.bary-b.bary||a.code.localeCompare(b.code):(a,b)=>a.code.localeCompare(b.code));
  const rowH=17, top=14, W=1000, xL=labels==="name"?250:120, xR=W-300, H=top*2+rowH*(cs.length-1);
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  cs.forEach((c,i)=>c.y=top+i*rowH);
  const qy=n=>top+(n-1)*(H-2*top)/(DATA.q.length-1);
  const gL=el("g",{},svg);
  edges.forEach(e=>{
    const y0=e.c.y,y1=qy(e.n),xm=(xL+xR)/2;
    e.path=el("path",{class:"lnk",d:`M${xL} ${y0}C${xm} ${y0} ${xm} ${y1} ${xR} ${y1}`,stroke:qc(e.n),"stroke-width":(0.6+e.v*0.75).toFixed(2),opacity:.42},gL);
  });
  cs.forEach(c=>{
    const g=el("g",{class:"cl"+(c.total?"":" none"),tabindex:0},svg); c.g=g;
    el("rect",{class:"hit",x:0,y:c.y-rowH/2,width:xL+6,height:rowH},g);
    el("circle",{cx:xL,cy:c.y,r:2.6},g);
    const t=el("text",{x:xL-8,y:c.y,"text-anchor":"end","dominant-baseline":"central"},g);
    t.textContent=labels==="name"?c.name:c.code;
    bind(g,{type:"c",c});
  });
  DATA.q.forEach(q=>{
    const g=el("g",{class:"ql",tabindex:0},svg); q.g=g; const y=qy(q.n);
    el("rect",{class:"hit",x:xR-6,y:y-14,width:300,height:28},g);
    el("circle",{cx:xR,cy:y,r:5.5,fill:qc(q.n)},g);
    const t=el("text",{x:xR+14,y,"dominant-baseline":"central",fill:qc(q.n)},g);
    t.textContent=`Q${q.n}  ${q.name}`;
    bind(g,{type:"q",q});
  });
  applySearch(); show(pinned);
}

function bind(g,sel){
  g.addEventListener("mouseenter",()=>{if(!pinned)show(sel)});
  g.addEventListener("mouseleave",()=>{if(!pinned)show(null)});
  const tog=ev=>{ev.stopPropagation();pinned=same(pinned,sel)?null:sel;show(pinned||sel)};
  g.addEventListener("click",tog);
  g.addEventListener("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();tog(ev)}});
}
const same=(a,b)=>a&&b&&a.type===b.type&&(a.c===b.c&&a.q===b.q);
svg.addEventListener("click",()=>{pinned=null;show(null)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){pinned=null;show(null)}});

function highlight(sel){
  DATA.courses.forEach(c=>c.g.classList.remove("on"));
  DATA.q.forEach(q=>q.g.classList.remove("on"));
  edges.forEach(e=>e.path.classList.remove("on"));
  if(!sel){svg.classList.remove("dim");return}
  svg.classList.add("dim");
  edges.forEach(e=>{
    if((sel.type==="c"&&e.c===sel.c)||(sel.type==="q"&&e.n===sel.q.n)){
      e.path.classList.add("on");e.c.g.classList.add("on");DATA.q[e.n-1].g.classList.add("on");
    }
  });
  if(sel.type==="c")sel.c.g.classList.add("on");
  if(sel.type==="q")sel.q.g.classList.add("on");
}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function chip(n){return `<span class="chip" style="background:${qc(n)}" title="${esc(DATA.q[n-1].name)}">Q${n}</span>`}

function show(sel){
  highlight(sel);
  const pinNote=pinned?`<button class="clear" id="clr">Release selection</button>`:"";
  if(!sel){
    const max=Math.max(...DATA.q.map(q=>qCourses[q.n].length));
    const none=DATA.courses.filter(c=>!c.total);
    panel.innerHTML=`<p class="hint">Hover or tap a course or qualification for details.</p>
      <div class="lbl">Courses linking to each qualification</div>
      <div class="rows">${DATA.q.map(q=>`<div class="row" data-q="${q.n}"><span class="nm">Q${q.n} ${esc(q.name)}</span>
        <span class="bar" style="width:${(qCourses[q.n].length/max*100).toFixed(0)}%;background:${qc(q.n)}"></span><span class="v">${qCourses[q.n].length}</span></div>`).join("")}</div>
      <div class="lbl">No qualifications listed (${none.length})</div>
      <div class="rows">${none.map(c=>`<div class="row" data-c="${c.code}"><span class="nm">${esc(c.name)}</span><span></span><span></span></div>`).join("")}</div>`;
  } else if(sel.type==="c"){
    const c=sel.c;
    panel.innerHTML=`<h2>${esc(c.name)}</h2><div class="code">${esc(c.code)} · ${c.los.length} LOs · ${Object.keys(c.cnt).length} of 11 qualifications</div>
      <div class="lbl">Learning objectives</div>
      <ol class="los">${c.los.map(l=>`<li><span class="n">${esc(l.no)}</span><div>${esc(l.text)||"<em>(no text)</em>"}
        <div class="chips">${l.q.length?l.q.map(chip).join(""):`<span class="chip empty">not mapped</span>`}</div></div></li>`).join("")}</ol>${pinNote}`;
  } else {
    const q=sel.q, list=qCourses[q.n], max=list.length?list[0].v:1;
    panel.innerHTML=`<h2 style="color:${qc(q.n)}">Q${q.n} ${esc(q.name)}</h2><p class="desc">${esc(q.desc)}</p>
      <div class="lbl">${list.length} courses · number of LOs</div>
      <div class="rows">${list.map(e=>`<div class="row" data-c="${e.c.code}"><span class="nm">${esc(e.c.name)}</span>
        <span class="bar" style="width:${(e.v/max*100).toFixed(0)}%;background:${qc(q.n)}"></span><span class="v">${e.v}</span></div>`).join("")}</div>${pinNote}`;
  }
  panel.querySelectorAll(".row").forEach(r=>r.addEventListener("click",()=>{
    pinned=r.dataset.q?{type:"q",q:DATA.q[r.dataset.q-1]}:{type:"c",c:DATA.courses.find(c=>c.code===r.dataset.c)};show(pinned)}));
  const b=document.getElementById("clr"); if(b)b.addEventListener("click",()=>{pinned=null;show(null)});
}

function applySearch(){
  const s=search.trim().toLowerCase();
  DATA.courses.forEach(c=>c.g.classList.toggle("miss",!!s&&!(c.name.toLowerCase().includes(s)||c.code.toLowerCase().includes(s))));
}
document.getElementById("q").addEventListener("input",e=>{
  search=e.target.value;applySearch();
  const s=search.trim().toLowerCase(), hits=s?DATA.courses.filter(c=>c.name.toLowerCase().includes(s)||c.code.toLowerCase().includes(s)):[];
  if(hits.length===1){pinned={type:"c",c:hits[0]};show(pinned)}
});
function seg(a,b,set){[a,b].forEach(id=>document.getElementById(id).addEventListener("click",()=>{
  document.getElementById(a).setAttribute("aria-pressed",id===a);document.getElementById(b).setAttribute("aria-pressed",id===b);set(id===a);draw()}))}
seg("o-cluster","o-code",v=>order=v?"cluster":"code");
seg("l-name","l-code",v=>labels=v?"name":"code");
draw();
</script>

</body>
</html>
